<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG odpověď</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>
  <body>
    <header class="top">
      <div class="title">
        <p class="eyebrow">fastmcp-rag-timer</p>
        <h1>Co o tom ví server</h1>
      </div>
      <form id="query-form">
        <label for="query">Dotaz</label>
        <textarea
          id="query"
          name="query"
          rows="3"
          required
          placeholder="co ví server o lokalitě Vršovice a secesi zde"
        ></textarea>
        <div class="form-row">
          <button type="submit">Odpovědět</button>
        </div>
      </form>
      <p id="status" role="status"></p>
    </header>
    <main class="answer-layout">
      <article id="answer" hidden></article>
      <p id="answer-note" class="quiet" hidden></p>
      <div id="figures"></div>
      <div id="map" hidden></div>
      <details id="sources">
        <summary>Zdroje</summary>
        <div id="sources-body"></div>
      </details>
      <dialog id="page-lightbox">
        <form method="dialog">
          <button type="submit">Zavřít</button>
        </form>
        <figure>
          <div class="page-frame lightbox-frame">
            <img id="lightbox-image" alt="" />
            <span id="lightbox-marks" class="page-highlights"></span>
          </div>
          <figcaption id="lightbox-caption"></figcaption>
        </figure>
      </dialog>
      <section class="trace-panel" aria-label="Průběh dotazu">
        <div class="trace-bar">
          <h2>Průběh</h2>
          <button id="copy-trace" type="button">Kopírovat</button>
        </div>
        <pre id="trace"></pre>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
